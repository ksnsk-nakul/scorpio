<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c1a2e"/><stop offset="100%" stop-color="#162447"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <!-- Role hierarchy diagram -->
  <g font-family="system-ui,sans-serif">
    <!-- Admin box -->
    <rect x="325" y="60" width="150" height="50" rx="8" fill="#1e40af" opacity="0.9"/>
    <text x="400" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Admin</text>
    <!-- Lines -->
    <line x1="310" y1="110" x2="200" y2="175" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <line x1="490" y1="110" x2="600" y2="175" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <line x1="400" y1="110" x2="400" y2="175" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <!-- Editor box -->
    <rect x="125" y="175" width="150" height="50" rx="8" fill="#1d4ed8" opacity="0.8"/>
    <text x="200" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Editor</text>
    <!-- Manager box -->
    <rect x="325" y="175" width="150" height="50" rx="8" fill="#1d4ed8" opacity="0.8"/>
    <text x="400" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Manager</text>
    <!-- Viewer box -->
    <rect x="525" y="175" width="150" height="50" rx="8" fill="#1d4ed8" opacity="0.8"/>
    <text x="600" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Viewer</text>
    <!-- Permission pills -->
    <rect x="80" y="270" width="240" height="34" rx="17" fill="#2563eb" opacity="0.5"/>
    <text x="200" y="292" text-anchor="middle" font-size="13" fill="#bfdbfe">read • write • delete</text>
    <rect x="280" y="270" width="240" height="34" rx="17" fill="#2563eb" opacity="0.5"/>
    <text x="400" y="292" text-anchor="middle" font-size="13" fill="#bfdbfe">read • write</text>
    <rect x="480" y="270" width="240" height="34" rx="17" fill="#2563eb" opacity="0.5"/>
    <text x="600" y="292" text-anchor="middle" font-size="13" fill="#bfdbfe">read only</text>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="bold" fill="white">Permission Hierarchy</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8">Granular role-based access control</text>
  <rect x="350" y="440" width="100" height="3" rx="2" fill="#3b82f6"/>
</svg>
