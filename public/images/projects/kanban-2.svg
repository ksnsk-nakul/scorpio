<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c0c0e"/><stop offset="100%" stop-color="#111827"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <!-- Sprint burn-down chart -->
  <g>
    <rect x="60" y="60" width="680" height="320" rx="16" fill="#111827"/>
    <text x="400" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#e5e7eb">Sprint Burndown · Week 3</text>
    <!-- Axes -->
    <line x1="120" y1="290" x2="680" y2="290" stroke="#374151" stroke-width="1.5"/>
    <line x1="120" y1="120" x2="120" y2="290" stroke="#374151" stroke-width="1.5"/>
    <!-- Ideal line -->
    <line x1="120" y1="130" x2="680" y2="290" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Actual progress -->
    <polyline points="120,130 200,155 280,175 360,200 440,215 520,245 600,260" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Dots -->
    <circle cx="120" cy="130" r="5" fill="#f59e0b"/>
    <circle cx="200" cy="155" r="5" fill="#f59e0b"/>
    <circle cx="280" cy="175" r="5" fill="#f59e0b"/>
    <circle cx="360" cy="200" r="5" fill="#f59e0b"/>
    <circle cx="440" cy="215" r="5" fill="#f59e0b"/>
    <circle cx="520" cy="245" r="5" fill="#f59e0b"/>
    <!-- Axis labels -->
    <text x="110" y="130" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">60</text>
    <text x="110" y="210" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">30</text>
    <text x="110" y="290" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">0</text>
    <text x="120" y="308" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Mon</text>
    <text x="195" y="308" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Tue</text>
    <text x="270" y="308" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Wed</text>
    <text x="345" y="308" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Thu</text>
    <text x="425" y="308" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Fri</text>
  </g>
  <text x="400" y="425" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="white">Sprint Velocity Tracking</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Real-time progress analytics</text>
  <rect x="340" y="478" width="120" height="3" rx="2" fill="#f59e0b"/>
</svg>
