  <text x="180" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="bold" fill="#a5b4fc">47</text>
  <text x="180" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6366f1">Books</text>
