<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c0c1e"/><stop offset="100%" stop-color="#1e1e4f"/></linearGradient></defs>
  <rect width="800" height="500" fill="url(#g)"/>
